name: Build Windows Node EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: x86_64-pc-windows-msvc

    - name: Build Node (Release)
      run: cargo build --release --bin node --features pqc-dilithium

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: coiwin-node-windows
        path: target/release/node.exe
