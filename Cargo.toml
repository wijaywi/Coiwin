[package]
name = "coiwin"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
pqcrypto-dilithium = "0.5"
pqcrypto-kyber = "0.8"
clap = { version = "4.4", features = ["derive"] }
k256 = { version = "0.13", features = ["ecdsa"] }
pqcrypto-traits = "*"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
hex = "0.4"

[features]
default = []
pqc-dilithium = []
pqc-kyber = []
